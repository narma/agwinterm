// The agwinterm pty-host protocol, v2 (protobuf wire; v1 was newline-JSON —
// removed by decision on #134: schema-driven codegen beats hand-parsed JSON,
// especially for the C++ lite client).
//
// Transport framing (all speakers): each message on the CONTROL pipe is a
// 4-byte little-endian length prefix followed by exactly that many bytes of
// the encoded Request (client→host) or Reply (host→client). Strict
// request/response alternation per connection. DATA pipes stay raw bytes —
// keystrokes and VT output are never serialized.
//
// The hello handshake remains the hard compatibility gate: hosts refuse a
// protocol number they don't speak, loudly.

syntax = "proto3";

package agwinterm.ptyhost;

option csharp_namespace = "Agwinterm.Pty.Proto";

message Request {
  oneof cmd {
    Hello hello = 1;
    Create create = 2;
    Attach attach = 3;
    SessionRef detach = 4;
    Resize resize = 5;
    SessionRef kill = 6;
    List list = 7;
    Shutdown shutdown = 8;
    PrepareCreate prepare_create = 9;
    CreationRef query_create = 10;
    CreationRef cancel_create = 11;
    ThemeUpdate theme_update = 12;
  }
}

message Hello {
  uint32 protocol = 1;   // must equal the host's version (2 = protobuf wire)
}

message Create {
  string id = 1;
  uint32 cols = 2;
  uint32 rows = 3;
  string app = 4;
  repeated string args = 5;
  string cwd = 6;                 // empty = inherit
  bool verbatim = 7;
  bool de_elevate = 8;
  bool fresh_env_off = 9;         // proto3 default false = freshEnv ON (matches v1 semantics)
  map<string, string> env = 10;
  string creation_ticket = 11;  // creation_revision >= 1: host-issued, single-use spawn authority
  string emulator_core = 12;   // core_selection_revision >= 1: managed/rust/ghostty; empty = host default
  bool single_owner = 13;      // presentation_revision >= 1; requires Ghostty, no raw-stream fallback
  reserved 14; // retired UI-owner prototype
}

message Attach {
  string id = 1;
  bool repaint = 2;
  string creation_ticket = 3;   // optional expected incarnation; mismatch refuses
  bool native_snapshot = 4;    // accept length-prefixed Ghostty snapshot before raw PTY bytes
  uint32 presentation_revision = 5;
  reserved 6; // retired UI-owner prototype
}

message SessionRef {
  string id = 1;
  string creation_ticket = 2;   // optional expected incarnation; mismatch refuses
}

message Resize {
  string id = 1;
  uint32 cols = 2;
  uint32 rows = 3;
  string creation_ticket = 4;   // optional expected incarnation; mismatch refuses
}

message ThemeUpdate {
  string id = 1;
  string creation_ticket = 2;
  string colors = 3;  // rrggbb;rrggbb
  string palette = 4; // 16 or 256 semicolon-separated rrggbb entries
  string cursor = 5;  // rrggbb
  uint32 cursor_default = 6; // 0 = unchanged, 1..6 = DECSCUSR default shape and blink
}

// Preparation never starts a child. A lost prepare reply may be abandoned safely. A client must
// never allocate a replacement ticket or replay a legacy create after an ambiguous create reply.
message PrepareCreate { string id = 1; }
message CreationRef { string id = 1; string ticket = 2; }
enum CreationPhase {
  CREATION_UNKNOWN = 0;         // cannot start or address a child under this ticket
  CREATION_PREPARED = 1;
  CREATION_CREATING = 2;
  CREATION_LIVE = 3;
  CREATION_CANCELLING = 4;      // cleanup requested, NOT yet proven complete
}
message CreationReply { string id = 1; string ticket = 2; CreationPhase phase = 3; }

message List {}
message Shutdown {}

message Reply {
  bool ok = 1;
  string error = 2;               // set when ok = false
  oneof body {
    HelloReply hello = 3;
    CreateReply create = 4;
    AttachReply attach = 5;
    ListReply list = 6;
    CreationReply creation = 7;
  }
}

message HelloReply {
  uint32 protocol = 1;
  uint32 pid = 2;
  uint32 creation_revision = 3; // 0 = legacy limitations; 1 = prepare/query/cancel + incarnation checks
  uint32 core_selection_revision = 4; // 1 = per-session core selection and authoritative attach core
  uint32 theme_revision = 5; // 1 = update live query defaults without injecting VT
  uint32 presentation_revision = 6; // 1 = bounded viewport channel plus ordered semantic input
  reserved 7; // retired UI-owner prototype
}

message CreateReply {
  string id = 1;
  string creation_ticket = 2;
}

message AttachReply {
  string pipe = 1;                // data-pipe name to connect
  uint32 cols = 2;
  uint32 rows = 3;
  uint32 child_pid = 4;           // 0 = unknown
  bool has_exited = 5;
  int32 exit_code = 6;
  string modes = 7;               // synthesized VT reproducing mode state (DumpModes)
  repeated string scrollback = 8; // plain-text history rows, oldest first (back-compat / lite)
  // Full-fidelity attributed scrollback: a serialized agwinterm.persist.PBuffer of the HISTORY
  // rows (colours + styles). When present the client seeds from this instead of the plain text,
  // so a reattached view is not dim-until-repaint. Empty when the host can't produce it (a Rust
  // host without persist support yet); the client falls back to `scrollback`.
  bytes scrollback_blob = 9;
  string creation_ticket = 10;
  bool native_snapshot = 11;   // data pipe starts with uint32 LE length + snapshot
  string emulator_core = 12;   // authoritative session core, independent of current UI preference
  uint32 presentation_revision = 13;
  string input_pipe = 14;
  uint64 attachment_epoch = 15;
  reserved 16; // retired UI-owner prototype
  string query_pipe = 17; // optional revision-1 bounded owner queries; independent of input/frames
  string effect_pipe = 18;
}

message SessionInfo {
  string id = 1;
  uint32 cols = 2;
  uint32 rows = 3;
  uint32 child_pid = 4;
  bool has_exited = 5;
  int32 exit_code = 6;
  string title = 7;
  bool attached = 8;
  string creation_ticket = 9;
}

message ListReply {
  repeated SessionInfo sessions = 1;
}

// Presentation data pipes carry bounded records: uint32 total length, uint32
// protobuf-header length, PresentationFrameHeader, then the row payload. No VT
// stream or native pointer is valid on these pipes. Row encoding is revisioned.
message PresentationFrameHeader {
  uint32 revision = 1;
  string incarnation = 2;
  uint64 attachment_epoch = 3;
  uint64 sequence = 4;
  uint64 base_sequence = 5;
  uint64 viewport_revision = 6;
  int64 terminal_generation = 7;
  uint32 cols = 8;
  uint32 rows = 9;
  uint32 history_rows = 10;
  uint32 scroll_offset = 11;
  int64 scroll_generation = 12;
  uint32 cursor_col = 13;
  uint32 cursor_row = 14;
  bool cursor_visible = 15;
  uint32 cursor_shape = 16;
  bool alternate_screen = 17;
  uint32 background = 18;
  uint32 cursor_color = 19;
  string title = 20;
  string cwd = 21;
  uint32 modes = 22;
  uint32 keyboard_flags = 23;
  uint32 scroll_top = 24;
  uint32 scroll_bottom = 25;
  bool has_exited = 26;
  int32 exit_code = 27;
  int64 captured_ticks = 28; // opt-in QPC timestamp; 0 when diagnostics are disabled
  repeated PresentationImagePlacement images = 29;
  repeated int32 wrap_lengths = 30;
  repeated PresentationCommandMark marks = 31;
}

message PresentationCommandMark {
  int32 prompt_line = 1;
  int32 command_line = 2;
  int32 output_line = 3;
  int32 end_line = 4;
  optional int32 exit_code = 5;
}

message PresentationImagePlacement {
  uint64 generation = 1;
  int32 image_width = 2;
  int32 image_height = 3;
  uint32 format = 4;
  uint32 id = 5;
  uint32 layer = 6;
  int32 z = 7;
  int32 column = 8;
  int32 row = 9;
  uint32 offset_x = 10;
  uint32 offset_y = 11;
  uint32 width = 12;
  uint32 height = 13;
  uint32 source_x = 14;
  uint32 source_y = 15;
  uint32 source_width = 16;
  uint32 source_height = 17;
  uint32 payload_length = 18;
}

// Independent input pipe. Acceptance never waits for a frame/query round trip.
// All records are fenced by incarnation/epoch and strictly increasing sequence.
message PresentationInput {
  string incarnation = 1;
  uint64 attachment_epoch = 2;
  uint64 sequence = 3;
  uint32 kind = 4; // 1 key, 2 text, 3 paste, 4 mouse, 5 focus, 6 raw bytes
  uint32 virtual_key = 5;
  uint32 action = 6;
  uint32 modifiers = 7;
  string text = 8;
  uint32 unshifted = 9;
  uint32 consumed_modifiers = 10;
  int32 windows_unicode = 11;
  uint32 windows_control_state = 12;
  uint32 scan_code = 13;
  uint32 button = 14;
  float x = 15;
  float y = 16;
  uint32 cell_width = 17;
  uint32 cell_height = 18;
  bool focused = 19;
  bytes raw = 20;
  string windows_text = 21; // all committed UTF-16 units from Windows translation
  uint64 frame_sequence = 22; // kind 7: successfully presented frame credit
  PresentationViewport viewport = 23; // kind 8: fenced resize/scroll/visibility
  bool has_cell_position = 24;
  uint32 cell_column = 25;
  uint32 cell_row = 26;
  PresentationOwnerCommand owner_command = 27; // kind 9, ordered terminal mutation
}

message PresentationOwnerCommand {
  uint32 kind = 1; // 1 display injection; 2 clear; 3 reset; 4 scrollback limit
  bytes bytes = 2;
  bool history = 3;
  int32 rows = 4;
}

message PresentationViewport {
  uint64 revision = 1;
  uint32 cols = 2;
  uint32 rows = 3;
  uint32 cell_width = 4;
  uint32 cell_height = 5;
  uint32 scroll_offset = 6;
  bool visible = 7;
}

// One request/reply per connection. Disconnect/deadline cancels the query; a new
// attachment owns a new endpoint. Neither endpoint carries user input or VT.
message PresentationQuery {
  string incarnation = 1;
  uint64 attachment_epoch = 2;
  int64 generation = 3;
  string operation = 4;
  int32 start_row = 5;
  int32 row_count = 6;
  string text = 7;
  int32 result_limit = 8;
  uint64 frame_sequence = 9;
  uint64 image_generation = 10;
  int32 image_offset = 11;
}
message PresentationQueryReply {
  string incarnation = 1;
  uint64 attachment_epoch = 2;
  int64 generation = 3;
  string status = 4;
  repeated string rows = 5;
  bool truncated = 6;
  repeated PresentationSearchMatch matches = 7;
  bytes image_bytes = 8;
}
message PresentationSearchMatch {
  int32 line = 1;
  int32 column = 2;
  int32 end_line = 3;
  int32 end_column = 4;
}

message PresentationEffect {
  string incarnation = 1;
  uint64 attachment_epoch = 2;
  uint64 sequence = 3;
  uint32 kind = 4; // 0 settled end; 1 notification; 2 progress; 3 clipboard; 4 bell; 5 completion; 6 durable ZMX role; 7 current title and cwd
  string title = 5;
  string text = 6;
  int32 state = 7;
  int32 value = 8;
  int64 completion_sequence = 9;
}
