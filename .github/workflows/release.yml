name: Release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish the built assets (leave disabled to benchmark the full release build)'
        type: boolean
        default: false
      publish_packages:
        description: 'Submit to winget + Chocolatey regardless of the checkpoint rule'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  wsl-hook:
    uses: ./.github/workflows/wsl-hook.yml

  ghostty-runtime:
    uses: ./.github/workflows/ghostty-runtime.yml

  packages:
    name: ${{ matrix.runtime }} ${{ matrix.package }}
    needs: [wsl-hook, ghostty-runtime]
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        runtime: [net11, net10]
        package: [installer, portable]
    env:
      AgwintermNet11: ${{ matrix.runtime == 'net11' && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          pattern: wsl-hook-*
          merge-multiple: true
          path: artifacts/wsl-hook
      - uses: actions/download-artifact@v7
        with:
          name: ghostty-windows-runtime
          path: artifacts/ghostty-release-native
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('global.json', '**/*.csproj', '**/NuGet.Config', '**/nuget.config', '**/Directory.*.props', '**/Directory.*.targets') }}
          restore-keys: |
            nuget-${{ runner.os }}-${{ runner.arch }}-
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native -> target
      - name: Install Inno Setup
        if: matrix.package == 'installer'
        run: choco install innosetup -y --no-progress
      - name: Build installer
        if: matrix.package == 'installer'
        shell: pwsh
        run: ./installer/build.ps1
      - name: Build portable and verify its payload
        if: matrix.package == 'portable'
        shell: pwsh
        run: |
          ./installer/build-portable.ps1
          ./tests/integration/portable-tools.ps1
      - name: Name compatibility assets and reuse the standalone CLI
        shell: pwsh
        env:
          RUNTIME: ${{ matrix.runtime }}
          PACKAGE: ${{ matrix.package }}
        run: |
          if ($env:RUNTIME -eq 'net10') {
            Get-ChildItem installer/Output/agwinterm-*.exe | ForEach-Object {
              Rename-Item -LiteralPath $_.FullName -NewName ($_.Name -replace '^agwinterm-', 'agwinterm-net10-')
            }
          } else {
            Get-ChildItem installer/Output/agwinterm-*.exe | ForEach-Object {
              Copy-Item -LiteralPath $_.FullName -Destination (Join-Path $_.DirectoryName ($_.Name -replace '^agwinterm-', 'agwinterm-net11-'))
            }
            if ($env:PACKAGE -eq 'portable') {
              # Already self-contained, single-file, ReadyToRun and versioned by build-portable.ps1.
              Copy-Item installer/stage-portable/tools/agwintermctl.exe installer/Output/agwintermctl.exe
            }
          }
      - uses: actions/upload-artifact@v6
        with:
          name: release-${{ matrix.runtime }}-${{ matrix.package }}
          path: installer/Output/*.exe
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

  publish-release:
    # A single writer publishes only after all four packages have succeeded.
    # Manual build-only runs exercise the same package jobs without creating a release.
    needs: packages
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          pattern: release-*
          merge-multiple: true
          path: installer/Output
      - name: Verify the complete release asset set
        shell: pwsh
        run: |
          $iss = Get-Content installer/agwinterm.iss -Raw
          if ($iss -notmatch '#define\s+AppVersion\s+"([^"]+)"') { throw 'Missing release version' }
          $version = $Matches[1]
          $expected = @('agwintermctl.exe')
          foreach ($prefix in @('agwinterm', 'agwinterm-net11', 'agwinterm-net10')) {
            $expected += "$prefix-setup-$version.exe", "$prefix-portable-$version-win-x64.exe"
          }
          $actual = @(Get-ChildItem installer/Output -File | Select-Object -ExpandProperty Name)
          if (Compare-Object $expected $actual) { throw 'Release asset set differs from the updater contract' }
          foreach ($suffix in @("setup-$version.exe", "portable-$version-win-x64.exe")) {
            if ((Get-FileHash "installer/Output/agwinterm-$suffix").Hash -ne
                (Get-FileHash "installer/Output/agwinterm-net11-$suffix").Hash) {
              throw "NET 11 compatibility alias differs: $suffix"
            }
          }
      - name: Attest build provenance
        if: github.event_name == 'push' || inputs.publish_release
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: installer/Output/*.exe
      - name: Read curated release notes
        id: notes
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $path = "docs/releases/$env:RELEASE_TAG.md"
          if (Test-Path -LiteralPath $path) {
            "path=$path" >> $env:GITHUB_OUTPUT
            $title = (Get-Content -LiteralPath $path -TotalCount 1).TrimStart('#', ' ')
            "title=$title" >> $env:GITHUB_OUTPUT
          }
      - name: Stage complete GitHub Release
        if: github.event_name == 'push' || inputs.publish_release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          name: ${{ steps.notes.outputs.title || github.ref_name }}
          files: |
            installer/Output/agwinterm-setup-*.exe
            installer/Output/agwinterm-portable-*.exe
            installer/Output/agwintermctl.exe
            installer/Output/agwinterm-net11-*.exe
            installer/Output/agwinterm-net10-*.exe
          body_path: ${{ steps.notes.outputs.path }}
          generate_release_notes: true
          fail_on_unmatched_files: true
      - name: Publish complete release
        if: github.event_name == 'push' || inputs.publish_release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "$RELEASE_TAG" --draft=false --latest

  # ---- checkpoint releases ----------------------------------------------------------------------
  # winget and Chocolatey are HUMAN-MODERATED. Every submission costs a reviewer a slot in a queue,
  # and this project releases far faster than those queues drain — versions started stacking up
  # behind each other, which is how 0.17.x ended up with one package version in moderation blocking
  # the next (Chocolatey answers 403 to a new version while the previous one is unreviewed).
  #
  # So only CHECKPOINT versions are submitted: a patch number that is a multiple of 9 (x.y.9,
  # x.y.18, x.y.27...). Everything between them is a GitHub release, which the in-app updater and
  # scoop both consume perfectly well — scoop's Excavator polls on a schedule and has no reviewer to
  # burden, so it deliberately stays ungated.
  #
  # The gaps are the point. If .8 does not feel like something to put in front of a reviewer, go
  # straight to .10 and let the next checkpoint be .18. The rule never forces a submission; it only
  # ever decides whether one is allowed.
  #
  # To submit anything else — a security fix, or a x.y.0 that opens a new line — run this workflow
  # manually with publish_packages: true. That override exists because the rule has one sharp edge:
  # a minor bump (0.18.0) is NOT a checkpoint, so it reaches the package managers only at 0.18.9
  # unless it is pushed by hand.
  gate:
    if: github.event_name == 'push' || inputs.publish_release
    needs: publish-release
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.check.outputs.publish }}
    steps:
      - id: check
        shell: bash
        run: |
          if [ "${{ inputs.publish_packages }}" = "true" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "::notice::manual override - submitting to winget + Chocolatey"
            exit 0
          fi
          ref="${{ github.ref_name }}"
          case "$ref" in
            v*) ver="${ref#v}" ;;
            *)  echo "publish=false" >> "$GITHUB_OUTPUT"
                echo "::notice::not a tag - no package submission"
                exit 0 ;;
          esac
          patch="${ver##*.}"
          # A non-numeric patch (a prerelease like 0.17.9-rc1) is never a checkpoint: package
          # managers should see finished versions, and "-rc1" would fail the arithmetic anyway.
          if ! [[ "$patch" =~ ^[0-9]+$ ]]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$ver is a prerelease - no package submission"
            exit 0
          fi
          if [ "$patch" -gt 0 ] && [ $((patch % 9)) -eq 0 ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$ver is a checkpoint release - submitting to winget + Chocolatey"
          else
            next=$(( (patch / 9 + 1) * 9 ))
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$ver is not a checkpoint (next is ${ver%.*}.$next) - GitHub release only"
          fi

  # Opens the version-bump PR to microsoft/winget-pkgs for each release. Runs as a job here
  # (not a `release:` workflow) because releases published with GITHUB_TOKEN don't trigger
  # other workflows. Needs the WINGET_TOKEN secret — a classic PAT with the public_repo
  # scope (used to fork winget-pkgs and open the PR); skips with a warning if unset.
  # The scoop bucket needs no equivalent: its Excavator updates itself on a schedule.
  winget:
    needs: [publish-release, gate]
    if: needs.gate.outputs.publish == 'true'
    runs-on: windows-latest
    # Best-effort: a brand-new package can't be updated until its first version clears winget-pkgs
    # moderation, so this can legitimately fail early on — don't fail the whole release for it.
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - name: Submit manifest to winget-pkgs
        shell: pwsh
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          if (-not $env:WINGET_TOKEN) { Write-Warning 'WINGET_TOKEN secret not set - skipping winget publish'; exit 0 }
          # Sync the fork FIRST. wingetcreate refuses to open a PR from a fork that has drifted
          # ("The forked repository could not be synced with the upstream commits. Sync your fork
          # manually and try again."), and upstream touches .github/workflows often enough that this
          # recurs — it blocked 0.17.3 until the fork was synced by hand. merge-upstream is
          # server-side, so it needs no checkout; the PAT carries the scope that a plain OAuth token
          # lacks. Best-effort: a fresh fork (or none yet) must not fail the release.
          $owner = '${{ github.repository_owner }}'
          try {
            $h = @{ Authorization = "token $env:WINGET_TOKEN"; 'User-Agent' = 'agwinterm-release'; Accept = 'application/vnd.github+json' }
            $r = Invoke-RestMethod -Method Post -Headers $h -Uri "https://api.github.com/repos/$owner/winget-pkgs/merge-upstream" -Body (@{ branch = 'master' } | ConvertTo-Json)
            Write-Host "fork sync: $($r.message)"
          } catch { Write-Warning "fork sync skipped: $($_.Exception.Message)" }
          $version = '${{ github.ref_name }}'.TrimStart('v')
          $url = "https://github.com/${{ github.repository }}/releases/download/v$version/agwinterm-setup-$version.exe"
          Invoke-WebRequest https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe
          # "|x64" pins the architecture: wingetcreate sniffs the Inno stub as x86 and otherwise
          # can't match the manifest's x64 installer node (this kept winget stuck at 0.10.0).
          .\wingetcreate.exe update yeroo.agwinterm --version $version --urls "$url|x64" --submit --token $env:WINGET_TOKEN

  # Packs and pushes the Chocolatey package to the community feed on each release. Every version
  # then goes through Chocolatey's moderation queue (automated validation + VM install test +
  # human review). Needs the CHOCO_API_KEY secret (from your community.chocolatey.org account);
  # skips with a warning if unset. Rewrites version + download URL + checksum in-place from the
  # release asset so the committed template can stay pinned at the last released version.
  chocolatey:
    needs: [publish-release, gate]
    if: needs.gate.outputs.publish == 'true'
    runs-on: windows-latest
    # Best-effort: Chocolatey rejects new versions of a package whose first version is still in
    # moderation (403), so this can legitimately fail early on — don't fail the whole release for it.
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Pack and push to Chocolatey
        shell: pwsh
        env:
          CHOCO_API_KEY: ${{ secrets.CHOCO_API_KEY }}
        run: |
          if (-not $env:CHOCO_API_KEY) { Write-Warning 'CHOCO_API_KEY secret not set - skipping chocolatey publish'; exit 0 }
          # Shared with choco-push.yml (the repush-a-moderated-version path) so the two can't drift.
          $version = '${{ github.ref_name }}'.TrimStart('v')
          ./packaging/chocolatey/publish.ps1 -Version $version -ApiKey $env:CHOCO_API_KEY -Repository '${{ github.repository }}'
