name: macOS remote bridge

on:
  workflow_call:

permissions:
  contents: read

jobs:
  macos-remote:
    name: macOS remote bridge
    # ARM real-peer acceptance runs on the supplied Mac. Intel hosted runners
    # avoid ARM capacity cancellations and cover the other macOS architecture.
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Test remote page document lifecycle (host-free)
        run: node tests/integration/zmx/page-document-lifecycle-tests.mjs
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: native -> target
      - name: Test shared identity and build remote bridge
        run: cargo test --locked --manifest-path native/Cargo.toml -p agwinterm-zmx -p agwinterm-remote
      - name: Check macOS arm64 target
        run: |
          rustup target add aarch64-apple-darwin
          cargo check --locked --manifest-path native/Cargo.toml -p agwinterm-zmx -p agwinterm-remote --target aarch64-apple-darwin
