name: CI

on:
  push:
    branches: [ main, narma ]
  pull_request:
    branches: [ main, narma ]
  workflow_dispatch:

permissions:
  contents: read

# Supersede only runs for the same PR/ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ghostty-contract:
    name: Ghostty Windows native contract
    runs-on: windows-latest
    env:
      ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}/artifacts/ghostty-zig-global
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.1.0
        with:
          global-json-file: global.json
          check-latest: false
          skip-lts-prepass: true
      # No restore prefix: a compiled bundle is usable only for these exact inputs.
      # Tests run below even on an exact hit; only native compilation is skipped.
      - name: Cache native Ghostty bundle
        id: ghostty-native
        uses: actions/cache@v5
        with:
          path: |
            artifacts/ghostty-build/bin
            artifacts/ghostty-build/search-tests/bin
            artifacts/ghostty-build/provenance.json
            artifacts/ghostty-build/licenses
          key: ghostty-native-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('native/ghostty-vt/pin.json', 'native/ghostty-vt/*.zig', 'native/ghostty-vt/*.c', 'native/ghostty-vt/*.h', 'native/ghostty-vt/*.ps1', 'native/ghostty-vt/patches/**') }}
      - name: Cache pinned build toolchain
        if: steps.ghostty-native.outputs.cache-hit != 'true'
        uses: actions/cache@v5
        with:
          path: artifacts/toolchains
          key: ghostty-zig-windows-${{ hashFiles('native/ghostty-vt/pin.json') }}
      # Clone before restoring the local Zig cache into that directory: git clone
      # refuses a destination that contains only restored cache files.
      - name: Prepare pinned Ghostty source
        if: steps.ghostty-native.outputs.cache-hit != 'true'
        shell: pwsh
        run: ./native/ghostty-vt/build.ps1 -PrepareOnly
      - name: Cache Ghostty packages and compiler outputs
        if: steps.ghostty-native.outputs.cache-hit != 'true'
        uses: actions/cache@v5
        with:
          path: |
            artifacts/ghostty-source/.zig-cache
            artifacts/ghostty-source/zig-pkg
            artifacts/ghostty-zig-global
          key: ghostty-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('native/ghostty-vt/pin.json') }}-${{ hashFiles('native/ghostty-vt/*.zig', 'native/ghostty-vt/*.c', 'native/ghostty-vt/*.h', 'native/ghostty-vt/*.ps1', 'native/ghostty-vt/patches/**') }}
          restore-keys: |
            ghostty-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('native/ghostty-vt/pin.json') }}-
      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('global.json', '**/*.csproj', '**/NuGet.Config', '**/nuget.config', '**/Directory.*.props', '**/Directory.*.targets') }}
          restore-keys: |
            nuget-${{ runner.os }}-${{ runner.arch }}-
      - name: Build pinned Ghostty and adapter
        if: steps.ghostty-native.outputs.cache-hit != 'true'
        shell: pwsh
        run: ./native/ghostty-vt/build.ps1 -BuildSearchTests
      - name: Execute upstream Debug search tests
        shell: pwsh
        run: |
          $timer = [Diagnostics.Stopwatch]::StartNew()
          & ./artifacts/ghostty-build/search-tests/bin/ghostty-vt-c-test.exe
          if ($LASTEXITCODE -ne 0) { throw "Ghostty search tests failed: $LASTEXITCODE" }
          Write-Host ("Ghostty Debug search test execution: {0:N2}s" -f $timer.Elapsed.TotalSeconds)
      - name: Exercise the native contract
        shell: pwsh
        run: dotnet run --project tests/Agwinterm.GhosttyHarness -c Release -- artifacts/ghostty-build/bin
      - name: Upload build provenance
        uses: actions/upload-artifact@v6
        with:
          name: ghostty-windows-provenance
          path: |
            artifacts/ghostty-build/provenance.json
            artifacts/ghostty-build/licenses

  wsl-hook:
    uses: ./.github/workflows/wsl-hook.yml

  macos-remote:
    uses: ./.github/workflows/macos-remote.yml

  ghostty-runtime:
    uses: ./.github/workflows/ghostty-runtime.yml

  portable-tools:
    name: portable tool (${{ matrix.tool }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        tool: [host, cli]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.1.0
        with:
          global-json-file: global.json
          check-latest: false
          skip-lts-prepass: true
      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('global.json', '**/*.csproj', '**/NuGet.Config', '**/nuget.config', '**/Directory.*.props', '**/Directory.*.targets') }}
          restore-keys: |
            nuget-${{ runner.os }}-${{ runner.arch }}-
      - name: Publish portable tool
        shell: pwsh
        run: ./installer/publish-portable-tool.ps1 -Tool ${{ matrix.tool }} -Destination artifacts/portable-tools
      - uses: actions/upload-artifact@v6
        with:
          name: portable-tool-${{ matrix.tool }}
          path: artifacts/portable-tools/${{ matrix.tool == 'host' && 'Agwinterm.Host.exe' || 'agwintermctl.exe' }}
          compression-level: 0
          if-no-files-found: error

  portable:
    name: portable WSL payload
    needs: [wsl-hook, ghostty-runtime, portable-tools]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.1.0
        with:
          global-json-file: global.json
          check-latest: false
          skip-lts-prepass: true
      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('global.json', '**/*.csproj', '**/NuGet.Config', '**/nuget.config', '**/Directory.*.props', '**/Directory.*.targets') }}
          restore-keys: |
            nuget-${{ runner.os }}-${{ runner.arch }}-
      - uses: actions/download-artifact@v7
        with:
          pattern: wsl-hook-*
          merge-multiple: true
          path: artifacts/wsl-hook
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native -> target
      - uses: actions/download-artifact@v7
        with:
          name: ghostty-windows-runtime
          path: artifacts/ghostty-release-native
      - uses: actions/download-artifact@v7
        with:
          pattern: portable-tool-*
          merge-multiple: true
          path: artifacts/portable-tools
      - name: Publish portable with both Linux architectures
        shell: pwsh
        run: ./installer/build-portable.ps1 -PrebuiltToolsDirectory artifacts/portable-tools
      - name: Verify the standalone portable payload
        shell: pwsh
        run: ./tests/integration/portable-tools.ps1

  windows-tests:
    name: windows (${{ matrix.suite }})
    needs: ghostty-runtime
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # Balance measured integration times; each group owns a separate desktop.
        include:
          - suite: core
            cache: core
          - suite: control
            cache: control
          - suite: host
            cache: control
          - suite: restore
            cache: control
          - suite: ui
            cache: ui
          - suite: workspace
            cache: ui
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v7
        with:
          name: ghostty-windows-runtime
          path: artifacts/ghostty-release-native

      - name: Setup .NET
        uses: actions/setup-dotnet@v6.1.0
        with:
          global-json-file: global.json
          check-latest: false
          skip-lts-prepass: true
      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('global.json', '**/*.csproj', '**/NuGet.Config', '**/nuget.config', '**/Directory.*.props', '**/Directory.*.targets') }}
          restore-keys: |
            nuget-${{ runner.os }}-${{ runner.arch }}-

      - name: UI evidence export fixtures
        if: matrix.suite == 'core'
        shell: pwsh
        run: ./tools/export-ui-evidence.tests.ps1

      - name: Windows Sandbox wrapper fixtures (no VM)
        if: matrix.suite == 'core'
        shell: pwsh
        run: ./tests/integration/sandbox-ui.tests.ps1

      - name: Windows Sandbox UI routing fixtures (no VM)
        if: matrix.suite == 'core'
        shell: pwsh
        run: ./tests/integration/sandbox-ui-routing.tests.ps1

      - name: Hyper-V UI runner lifecycle fixtures
        if: matrix.suite == 'core'
        shell: pwsh
        run: ./tests/integration/hyperv-ui.tests.ps1
      - name: Hyper-V worker transfer checks
        if: matrix.suite == 'core'
        shell: pwsh
        run: ./tests/integration/hyperv-ui-transfer.tests.ps1

      - name: WSL private desktop isolation fixtures (no distribution)
        if: matrix.suite == 'core'
        shell: pwsh
        run: ./tests/integration/wsl-ui.tests.ps1

      - name: Restore
        run: dotnet restore Agwinterm.slnx

      - name: Build
        run: dotnet build Agwinterm.slnx -c Release --no-restore

      - name: Build isolated WebView2 UI gate (no UI launch)
        if: matrix.suite == 'core'
        run: dotnet build tests/WebViewHost.Gate/WebViewHost.Gate.csproj -c Release


      - name: Restored Ghostty history and remote transport adoption
        if: matrix.suite == 'restore'
        shell: pwsh
        timeout-minutes: 10
        run: |
          . ./tests/ui/lib.ps1
          $exe = Resolve-Binary '' 'Agwinterm.Win32.exe' 'Agwinterm.Win32'
          if (-not $exe) { throw 'Built app not found' }
          dotnet publish tests/Agwinterm.GhosttyServerHarness -c Release --no-self-contained -o (Join-Path (Split-Path $exe) 'ghostty-server-tests')
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          foreach ($case in @('buffer-reflow-ghostty', 'buffer-reflow-ghostty-host', 'ghostty-remote-host-adoption')) {
            ./tests/integration/restore-roundtrip.ps1 -Exe $exe -Strict -Only $case
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Hosted Ghostty presentation and reconnect contracts
        if: matrix.suite == 'host'
        shell: pwsh
        timeout-minutes: 10
        run: |
          . ./tests/ui/lib.ps1
          $exe = Resolve-Binary '' 'Agwinterm.Win32.exe' 'Agwinterm.Win32'
          if (-not $exe) { throw 'Built app not found' }
          $harness = Join-Path $pwd 'artifacts/host-owner-ci-contracts'
          dotnet publish tests/Agwinterm.GhosttyServerHarness -c Release --no-self-contained -o $harness
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & (Join-Path $harness 'Agwinterm.GhosttyServerHarness.exe') (Split-Path $exe)
          exit $LASTEXITCODE

      # Verify the Windows product’s control-API contract.
      - name: Control-API conformance
        if: matrix.suite == 'control'
        shell: pwsh
        timeout-minutes: 15
        run: |
          ./tests/conformance/conformance-validator.unit.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./tests/conformance/conformance.ps1 -Strict

      # The clipboard guard the integration suite writes the runner's clipboard through, against a
      # fake clipboard: every state it can leave the clipboard in, including the ones a real run
      # cannot provoke (a partial put, a copy racing the sentinel).
      - name: Clipboard guard (fake)
        if: matrix.suite == 'core'
        shell: pwsh
        timeout-minutes: 5
        run: ./tests/integration/clipboard-guard.tests.ps1

      # The process the integration suite pastes into (a sink the control API starts directly, no
      # shell underneath) and the readiness test that gates the pastes, on synthetic pane text.
      - name: Paste sink (synthetic)
        if: matrix.suite == 'core'
        shell: pwsh
        timeout-minutes: 5
        run: ./tests/integration/paste-sink.tests.ps1

      - name: Win32 control-host integration
        if: matrix.suite == 'host'
        shell: pwsh
        timeout-minutes: 10
        run: ./tests/integration/win32-control.ps1 -Strict

      - name: Session command parity integration
        if: matrix.suite == 'ui'
        shell: pwsh
        timeout-minutes: 5
        run: ./tests/integration/hud-ui.ps1 -Suite Command -Strict

      - name: Control CLI reliability integration
        if: matrix.suite == 'control'
        shell: pwsh
        timeout-minutes: 5
        run: ./tests/integration/control-cli-reliability.ps1

      - name: Control events and status wait integration
        if: matrix.suite == 'control'
        shell: pwsh
        timeout-minutes: 5
        run: ./tests/integration/control-events-and-wait.ps1

      - name: Split terminal retention integration
        if: matrix.suite == 'control'
        shell: pwsh
        timeout-minutes: 5
        run: ./tests/integration/split-retention.ps1

      - name: Program overlay controls integration
        if: matrix.suite == 'ui'
        shell: pwsh
        timeout-minutes: 5
        run: ./tests/integration/program-overlay-controls.ps1 -Dpi 144

      - name: Passive HUD integration
        if: matrix.suite == 'ui'
        shell: pwsh
        timeout-minutes: 5
        run: ./tests/integration/hud-ui.ps1 -Strict

      - name: Detached quick terminal integration
        if: matrix.suite == 'ui'
        shell: pwsh
        timeout-minutes: 5
        run: ./tests/integration/hud-ui.ps1 -Suite Quick -Strict

      - name: Workspace navigation and sidebar integration
        if: matrix.suite == 'ui'
        shell: pwsh
        timeout-minutes: 5
        run: ./tests/integration/hud-ui.ps1 -Suite Navigation -Strict

      - name: Native picker integration
        if: matrix.suite == 'ui'
        shell: pwsh
        timeout-minutes: 5
        run: ./tests/integration/hud-ui.ps1 -Suite Picker -Strict

      - name: Native question integration
        if: matrix.suite == 'ui'
        shell: pwsh
        timeout-minutes: 5
        run: ./tests/integration/hud-ui.ps1 -Suite Ask -Strict

      - name: Advanced passive HUD integration
        if: matrix.suite == 'ui'
        shell: pwsh
        timeout-minutes: 5
        run: ./tests/integration/hud-ui.ps1 -Suite HudAdvanced -Strict

      - name: Recent work integration
        if: matrix.suite == 'workspace'
        shell: pwsh
        timeout-minutes: 5
        run: ./tests/integration/hud-ui.ps1 -Suite Recent -Strict

      - name: Menu bar integration
        if: matrix.suite == 'workspace'
        shell: pwsh
        timeout-minutes: 5
        run: ./tests/integration/hud-ui.ps1 -Suite Menu -Strict

      - name: Working sets integration
        if: matrix.suite == 'workspace'
        shell: pwsh
        timeout-minutes: 5
        run: ./tests/integration/hud-ui.ps1 -Suite WorkingSets -Strict

      - name: Native window controls integration
        if: matrix.suite == 'workspace'
        shell: pwsh
        timeout-minutes: 5
        run: ./tests/integration/hud-ui.ps1 -Suite Windows -Strict

      - name: Pane presentation and diagnostics integration
        if: matrix.suite == 'workspace'
        shell: pwsh
        timeout-minutes: 5
        run: ./tests/integration/hud-ui.ps1 -Suite Presentation -Strict

      - name: Test (Core + Pty)
        if: matrix.suite == 'core'
        # One retry for the known .NET 10 test-host #118 pathology under named-pipe churn, which
        # manifests two ways: a native CRASH ("Test Run Aborted") OR a DEADLOCK that hangs the run
        # forever (a pipe teardown that never completes — no crash, no output). The crash-only retry
        # missed the hang and stalled the job for hours, so this runs the suite under a hard timeout
        # and retries once on EITHER symptom. Genuine test failures fail immediately (no retry).
        shell: pwsh
        timeout-minutes: 25
        run: |
          function Invoke-Tests {
            if (Test-Path out.txt) { Remove-Item out.txt, err.txt -ErrorAction SilentlyContinue }
            $p = Start-Process dotnet -ArgumentList 'test','Agwinterm.slnx','-c','Release','--no-build','--logger','"console;verbosity=normal"' `
                 -NoNewWindow -PassThru -RedirectStandardOutput out.txt -RedirectStandardError err.txt
            if (-not $p.WaitForExit(360000)) {   # 6 min: the suite is ~30s, so this only trips on a deadlock
              try { $p.Kill($true) } catch {}
              [void]$p.WaitForExit(10000)
              Get-Content out.txt, err.txt -Raw -ErrorAction SilentlyContinue | Write-Host
              Write-Host '::warning::test run exceeded six minutes; killed. Logs above distinguish test progress from a runner hang; #118 is a known possibility, not a diagnosis.'
              return 'retry'
            }
            $out = (Get-Content out.txt, err.txt -Raw -ErrorAction SilentlyContinue) -join "`n"
            if ($p.ExitCode -eq 0) { Write-Host $out; return 'ok' }
            if ($out -match 'Test Run Aborted|host process crashed') {
              Write-Host '::warning::test host crashed natively (issue #118)'; return 'retry'
            }
            Write-Host $out; return 'fail'   # a genuine failure
          }
          $r = Invoke-Tests
          if ($r -eq 'ok') { exit 0 }
          if ($r -eq 'fail') { exit 1 }
          Write-Host '::warning::retrying the test suite once (issue #118)'
          if ((Invoke-Tests) -eq 'ok') { exit 0 } else { exit 1 }

      - name: Prepare native UI acceptance outcomes
        if: ${{ always() }}
        shell: pwsh
        run: ./tools/export-ui-evidence.ps1

      - name: Retain native UI acceptance outcomes
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: native-ui-${{ matrix.suite }}-${{ github.run_id }}-${{ github.run_attempt }}
          # Numeric summaries only; raw logs, screenshots and state stay local.
          path: artifacts/native-ui/index.json
          if-no-files-found: ignore
          retention-days: 30

  bridge-fixtures:
    name: Ralphex bridge fixtures
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Setup Go for Ralphex bridge fixtures
        id: go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache: false

      - name: Cache pinned Ralphex
        id: ralphex
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/ralphex-bin
          key: ralphex-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-v1.6.1

      - name: Install pinned Ralphex
        if: steps.ralphex.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $bin = Join-Path $env:RUNNER_TEMP 'ralphex-bin'
          New-Item -ItemType Directory -Force -Path $bin | Out-Null
          $env:GOBIN = $bin
          # The command is the module path plus the main package, which lives under
          # cmd/ - the module root holds no package, so the bare module path fails with
          # "found, but does not contain package".
          go install github.com/umputun/ralphex/cmd/ralphex@v1.6.1

      - name: Add Ralphex to PATH
        shell: pwsh
        run: Join-Path $env:RUNNER_TEMP 'ralphex-bin' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Ralphex-Revmux bridge fixtures
        shell: bash
        run: ./tools/test-ralphex-revmux.sh


  # Preserve the required check name; skipped/cancelled jobs must not pass it.
  build-test:
    name: build + test (windows)
    if: ${{ always() }}
    needs: [windows-tests, bridge-fixtures, portable, portable-tools, net10-publish, ghostty-contract, wsl-hook, ghostty-runtime, macos-remote]
    runs-on: ubuntu-latest
    steps:
      - name: Require all CI suites
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: echo "$RESULTS" | jq -e 'all(.[]; .result == "success")'

  net10-publish:
    name: .NET 10 compatibility publish
    needs: ghostty-runtime
    runs-on: windows-latest
    env:
      AgwintermNet11: 'false'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v7
        with:
          name: ghostty-windows-runtime
          path: artifacts/ghostty-release-native
      - uses: actions/setup-dotnet@v6.1.0
        with:
          global-json-file: global.json
          check-latest: false
          skip-lts-prepass: true
          dotnet-version: '10.0.x'
      - name: Test updater and publish supported .NET 10 app, host and CLI
        shell: pwsh
        run: |
          dotnet test tests/Agwinterm.Pty.Tests -c Release --filter FullyQualifiedName~AppUpdateTests
          if ($LASTEXITCODE -ne 0) { throw 'Updater tests failed' }
          dotnet publish src/Agwinterm.Host/Agwinterm.Host.csproj -c Release -r win-x64 --self-contained true -o artifacts/net10-host
          if ($LASTEXITCODE -ne 0) { throw 'Host publish failed' }
          dotnet publish src/Agwinterm.Win32/Agwinterm.Win32.csproj -c Release -r win-x64 --self-contained true -o artifacts/net10-app
          if ($LASTEXITCODE -ne 0) { throw 'App publish failed' }
          dotnet publish src/Agwinterm.Ctl/Agwinterm.Ctl.csproj -c Release -r win-x64 --self-contained true -o artifacts/net10-ctl
          if ($LASTEXITCODE -ne 0) { throw 'CLI publish failed' }
